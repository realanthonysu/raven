[package]
name = "raven"
version = "1.9.0"
description = "Raven — 英语学习助手"
authors = ["you"]
edition = "2024"

[lib]
name = "raven_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# A3: rustls-tls 替代 native-tls——避免 Linux 侧拖入 openssl 依赖树
tauri-plugin-http = { version = "2", default-features = false, features = ["stream", "rustls-tls"] }
# A1: Rust 侧代理 LLM 请求(密钥不出主进程),reqwest 用 rustls 后端与插件保持一致
# （0.13 起 rustls-tls feature 更名为 rustls，证书校验改用 rustls-platform-verifier）
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls", "json"] }
# SSRF 防护：代理命令校验前端 URL 时使用 WHATWG 规范解析（IPv4 归一化、IPv6 方括号）
url = "2"
futures-util = "0.3"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
r2d2 = "0.8"
r2d2_sqlite = "0.35"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
csv = "1"
tokio = { version = "1", features = ["rt-multi-thread", "fs"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-notification = "2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"

# keyring 4.x：平台后端改为 crate 内部按 target 选择的 optional 依赖，
# feature 只剩 default(=v1) 与 cli；默认 v1 模式按 target 启用原生凭据库
# （Windows Credential Manager / macOS Keychain / Linux Secret Service-zbus）。
# 注意 Linux 并非等价迁移：v3 的 linux-native 实为内核 keyutils（会话级易失），
# v4 改用 Secret Service——旧凭据不迁移，Linux 用户需重录 API Key。
keyring = "4.2"

# 测试需要 #[tokio::test] 为 async 的 validate_proxy_url（域名解析经
# spawn_blocking）提供 runtime；macros/rt 随依赖图（tauri 等）已启用，
# 此处显式声明，避免日后传递依赖调整时测试静默失效。
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
