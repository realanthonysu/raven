pre-commit:
  parallel: true
  commands:
    biome-check:
      glob: "*.{ts,tsx}"
      run: npx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    rust-fmt:
      glob: "*.rs"
      run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
    rust-clippy:
      glob: "*.rs"
      run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
    check-large-files:
      run: node scripts/check-large-files.js

pre-push:
  parallel: true
  commands:
    # 类型检查:biome 不做类型分析、vitest 默认也不 typecheck,
    # 此前类型错误三道本地闸全部放行(P0 构建损坏因此溜进主干)
    typecheck:
      run: npx tsc -b
    test:
      run: npx vitest run
    rust-test:
      run: cargo test --manifest-path src-tauri/Cargo.toml
